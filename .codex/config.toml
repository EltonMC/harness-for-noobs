# Project defaults for Codex. Codex does not run the Harness agent hooks, so the
# Git hooks (`npm run harness -- setup`) and CI remain the enforced guardrails.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# No network from sandboxed commands by default: content fetched from the web or
# issues can carry prompt-injected instructions to exfiltrate code or data.
[sandbox_workspace_write]
network_access = false
