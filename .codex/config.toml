# Project defaults for Codex. Codex runs the Harness agent hooks from
# .codex/hooks.json (resolved from the Git root, since Codex does not set
# CLAUDE_PROJECT_DIR); the Git hooks (`npm run harness -- setup`) and CI remain
# the enforced guardrails. Codex edits made with apply_patch carry no file path,
# so the edit rules still depend on the Git hooks and CI.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# No network from sandboxed commands by default: content fetched from the web or
# issues can carry prompt-injected instructions to exfiltrate code or data.
[sandbox_workspace_write]
network_access = false
