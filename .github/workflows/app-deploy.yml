name: App deploy

# Harness-managed. Production deploys run only for the merged main commit:
# verification first, then database migrations, then the frontend.
# Each job skips with a notice until the application and the secrets in
# docs/guia/02-contas-e-segredos.md exist.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Production verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      application: ${{ steps.app.outputs.exists }}
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect application
        id: app
        run: |
          if node -e "process.exit(require('./package.json').dependencies?.react ? 0 : 1)" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No application yet; deployment skipped."
          fi
      - name: Migrations require the local Supabase project
        run: |
          if ls supabase/migrations/*.sql > /dev/null 2>&1 && [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/migrations has files but supabase/config.toml is missing, so the migrations were never tested. Run supabase init in a pull request."
            exit 1
          fi
      - if: steps.app.outputs.exists == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.app.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.exists == 'true'
        name: Verify the merged commit before touching production
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - if: steps.app.outputs.exists == 'true' && hashFiles('supabase/config.toml') != ''
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - if: steps.app.outputs.exists == 'true' && hashFiles('supabase/config.toml') != ''
        name: Verify migrations locally before applying them to production
        run: |
          supabase db start
          supabase db lint --level warning --fail-on warning
          supabase test db
          supabase test db .harness/database/guards
          supabase db advisors --local --type security --level warn --fail-on warn

  database-plan:
    name: Classify pending production migrations
    needs: verify
    if: needs.verify.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      requires_owner_approval: ${{ steps.classify.outputs.requires_owner_approval }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check Supabase configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Database deploy skipped: Supabase production secrets are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.config.outputs.enabled == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Classifies everything production has not applied yet, not only this push's diff,
      # so a destructive migration left pending by a rejected release still needs approval.
      - if: steps.config.outputs.enabled == 'true'
        name: List pending migrations without applying them
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run 2>&1 | tee pending-migrations.txt
      - if: steps.config.outputs.enabled == 'true'
        name: Classify the pending migrations
        id: classify
        run: node .harness/scripts/database-guard.mjs --pending-from pending-migrations.txt | tee -a "$GITHUB_STEP_SUMMARY"

  database-approval:
    name: Owner approval for destructive migrations
    needs: database-plan
    if: needs.database-plan.outputs.requires_owner_approval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    # Configure required reviewers once with: npm run harness -- github-protect --apply
    environment: production-destructive
    steps:
      - name: Require a human approval rule on the environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/production-destructive" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>&1); then
            echo "::error::Could not read the production-destructive environment ($reviewers). Check it in Settings > Environments, then re-run this workflow."
            exit 1
          fi
          if [ "$reviewers" = "0" ] || [ -z "$reviewers" ]; then
            echo "::error::This release deletes or rewrites production data, but the production-destructive environment has no required reviewer. Run: npm run harness -- github-protect --apply (or add yourself as a required reviewer in Settings > Environments), then re-run this workflow."
            exit 1
          fi
          echo "Approved by a required reviewer of production-destructive."

  database:
    name: Production database migrations
    needs: [verify, database-plan, database-approval]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.application == 'true'
      && needs.database-plan.result == 'success'
      && (needs.database-approval.result == 'success' || needs.database-approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ENABLED: ${{ needs.database-plan.outputs.enabled }}
    steps:
      - if: env.ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.ENABLED == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - if: env.ENABLED == 'true'
        name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Schema only (no rows). Kept only for private repositories: on a public repository
      # anyone could download policies and function bodies from the artifact.
      - if: env.ENABLED == 'true' && github.event.repository.private
        name: Save the production schema before migrating (structure only, no personal data)
        run: supabase db dump --linked -f schema-before-migrations.sql
      - if: env.ENABLED == 'true' && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-before-migrations
          path: schema-before-migrations.sql
          retention-days: 30
      - if: env.ENABLED == 'true'
        name: Apply pending migrations
        run: supabase db push

  frontend:
    name: Production frontend
    needs: [verify, database]
    # Explicit results: a skipped database-approval job must not skip the frontend.
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.database.result == 'success'
      && needs.verify.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check Cloudflare and production configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Production deploy skipped: Cloudflare secrets are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PRODUCTION_SUPABASE_URL" ] || [ -z "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::PRODUCTION_SUPABASE_URL and PRODUCTION_SUPABASE_PUBLISHABLE_KEY must be set; a build without them breaks at runtime."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.enabled == 'true'
        name: Build with production configuration
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      - if: steps.config.outputs.enabled == 'true'
        run: node .harness/scripts/secret-scan.mjs --dir dist
      - if: steps.config.outputs.enabled == 'true'
        name: Deploy
        run: pnpm exec wrangler deploy --message "main ${{ github.sha }}"
      - if: steps.config.outputs.enabled == 'true' && env.PRODUCTION_URL != ''
        name: Smoke test the public URL
        run: |
          for _ in 1 2 3 4 5; do
            if headers=$(curl -fsSIL --max-time 10 "$PRODUCTION_URL"); then
              for header in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
                if ! printf '%s' "$headers" | grep -qi "^$header:"; then
                  if [ -f public/_headers ]; then
                    echo "::error::Production is missing the $header security header. Check public/_headers and the Cloudflare deployment."
                    exit 1
                  fi
                  echo "::warning::Production is missing the $header security header. Add public/_headers from the Harness app template (docs/guia/10-seguranca.md)."
                fi
              done
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production URL did not respond. Roll back in Cloudflare (Workers > Deployments). Database migrations already ran: fix forward with a new migration PR if needed."
          exit 1
