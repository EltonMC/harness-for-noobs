name: App CI

# Harness-managed. Every job reports success with a notice until the application
# exists (npm run harness -- init-app), so these checks can be required from day one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public placeholders so builds that import the Supabase client succeed in CI.
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect application
        id: app
        run: |
          if node -e "process.exit(require('./package.json').dependencies?.react ? 0 : 1)" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No application yet (npm run harness -- init-app); application checks skipped."
          fi
      - if: steps.app.outputs.exists == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.app.outputs.exists == 'true'
        name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.exists == 'true'
        name: Dependency vulnerabilities (high or critical with an available fix)
        run: pnpm audit --audit-level high --ignore-unfixable
      - if: steps.app.outputs.exists == 'true'
        name: Lint and format
        run: pnpm lint
      - if: steps.app.outputs.exists == 'true'
        name: Type-check
        run: pnpm typecheck
      - if: steps.app.outputs.exists == 'true'
        name: Unused files, exports, and dependencies
        run: pnpm run --if-present knip
      - if: steps.app.outputs.exists == 'true'
        name: Unit and component tests (with coverage thresholds when configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:coverage'] ? 0 : 1)"; then
            pnpm test:coverage
          else
            pnpm test
          fi
      - if: steps.app.outputs.exists == 'true'
        name: Build
        run: pnpm build
      - if: steps.app.outputs.exists == 'true'
        name: Secret scan (browser bundle)
        run: node .harness/scripts/secret-scan.mjs --dir dist
      - if: steps.app.outputs.exists == 'true'
        name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.app.outputs.exists == 'true'
        name: End-to-end smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Database gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runs even without supabase/config.toml, so migrations can never skip the gate silently.
      - name: Database change guard (published migrations, DBA review, owner approval, destructive SQL)
        id: guard
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          node .harness/scripts/database-guard.mjs --base "origin/$BASE_REF" > database-guard.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat database-guard.md
          cat database-guard.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.guard.outputs.has_migrations == 'true'
        name: Comment the database report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .harness/scripts/upsert-pr-comment.mjs --pr "$PR_NUMBER" --marker harness-database-guard --body-file database-guard.md
      - name: Fail when the database change guard found problems
        if: steps.guard.outputs.status != '0'
        run: |
          echo "::error::Database change guard failed. Read the report above (or the pull request comment) for what is missing."
          exit 1
      - name: Detect local Supabase project
        id: db
        run: |
          if [ -f supabase/config.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/config.toml not found (run supabase init); database checks skipped."
          fi
      - if: steps.db.outputs.exists == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - if: steps.db.outputs.exists == 'true'
        name: Start local Postgres from migrations
        run: supabase db start
      - if: steps.db.outputs.exists == 'true'
        name: Database lint
        run: supabase db lint --level warning --fail-on warning
      - if: steps.db.outputs.exists == 'true'
        name: Database tests (RLS and pgTAP)
        run: supabase test db
      - if: steps.db.outputs.exists == 'true'
        name: Harness database guardrails (RLS, views, policies, functions, personal data)
        run: supabase test db .harness/database/guards
      - if: steps.db.outputs.exists == 'true'
        name: Supabase security advisors
        run: supabase db advisors --local --type security --level warn --fail-on warn
      - if: steps.db.outputs.exists == 'true'
        name: Generated database types match the migrations
        run: |
          if [ ! -f src/lib/database.types.ts ]; then
            echo "::notice::src/lib/database.types.ts not found; database types check skipped."
            exit 0
          fi
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -q src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts" > /dev/null; then
            echo "::error::src/lib/database.types.ts is out of date. Run pnpm db:types with the local database on and commit the result."
            exit 1
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Supabase configuration and Edge Functions baseline
        run: node .harness/scripts/supabase-config-guard.mjs
      - name: Detect application sources
        id: app
        run: |
          paths=""
          for path in src e2e supabase/functions; do
            if [ -d "$path" ]; then paths="$paths $path"; fi
          done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          if [ -z "$paths" ]; then echo "::notice::No application sources yet; static analysis skipped."; fi
      - if: steps.app.outputs.paths != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - if: steps.app.outputs.paths != ''
        name: Static analysis (Semgrep rules for React, TypeScript, and secrets)
        env:
          SCAN_PATHS: ${{ steps.app.outputs.paths }}
        # SCAN_PATHS is a space-separated list of fixed directory names.
        run: |
          # shellcheck disable=SC2086
          uvx semgrep@1.177.0 scan --config p/react --config p/typescript --config p/secrets --error --metrics=off $SCAN_PATHS

  dependency-review:
    name: Dependency review
    # Dependency review needs GitHub Advanced Security on private repositories.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  preview:
    name: Preview deployment
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # Preview secrets live in the preview environment; it never holds production database credentials.
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
      PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check application and Cloudflare configuration
        id: config
        run: |
          if ! node -e "process.exit(require('./package.json').dependencies?.react ? 0 : 1)" 2>/dev/null; then
            echo "::notice::No application yet; preview skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PREVIEW_SUPABASE_URL" ] || [ -z "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::notice::Preview skipped: Cloudflare secrets or preview Supabase variables are not configured (docs/guia/02-contas-e-segredos.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.enabled == 'true'
        name: Build with preview configuration
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      - if: steps.config.outputs.enabled == 'true'
        run: node .harness/scripts/secret-scan.mjs --dir dist
      - if: steps.config.outputs.enabled == 'true'
        name: Upload preview version
        id: upload
        run: |
          set +e
          output=$(pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }}" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qiE 'does not exist|not found|10007'; then
              echo "::notice::The Worker does not exist yet. Merge once to main so production deploys it; previews work after that."
              exit 0
            fi
            exit "$status"
          fi
          url=$(echo "$output" | grep -Eo 'https://pr-[^ ]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then url=$(echo "$output" | grep -Eo 'https://[^ ]+\.workers\.dev' | tail -1); fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.enabled == 'true' && steps.upload.outputs.url != ''
        name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '🔎 **Prévia desta mudança:** %s\n\nAbra o link e siga o roteiro "Como testar" da descrição do PR antes de aprovar.' "$PREVIEW_URL")
          if [ -n "$(git diff --name-only "origin/$BASE_REF...HEAD" -- supabase/migrations)" ]; then
            # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
            body=$(printf '%s\n\n⚠️ **Este PR muda o banco de dados.** A prévia usa o banco de preview, que não recebe estas migrations. Teste as mudanças de banco localmente: `pnpm db:reset` e `pnpm dev`.' "$body")
          fi
          printf '%s\n' "$body" > preview-comment.md
          node .harness/scripts/upsert-pr-comment.mjs --pr "$PR_NUMBER" --marker harness-preview --body-file preview-comment.md
      - if: steps.config.outputs.enabled == 'true' && steps.upload.outputs.url != ''
        name: Passive security scan of the preview (OWASP ZAP baseline, report only)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.upload.outputs.url }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
