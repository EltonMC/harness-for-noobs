name: Harness template smoke

# Maintainer-only (excluded from generated projects): scaffolds the real
# application template into a temporary project and runs its gates.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Template smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - name: Scaffold the template into a temporary project
        run: |
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project"
          git ls-files -z | xargs -0 -I{} cp --parents {} "$project"
          cd "$project"
          printf 'project_name: "Pão d'"'"'Água & Cia"\nowner_locale: pt-BR\nproduct_locale: pt-BR\ncommands:\n  lint: unset\n' > .harness/project.yaml
          node --input-type=module -e "import('./.harness/scripts/init-app.mjs').then((m) => m.initApplication({ root: process.cwd(), runSupabaseInit: false }))"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
      - name: Install from the template lockfile
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --frozen-lockfile
      - name: Run the application gates
        working-directory: ${{ env.PROJECT }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          node .harness/scripts/secret-scan.mjs --dir dist
