name: Skill source maintenance

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate Harness script tests
        run: npm test
      - name: Install the committed managed sources in the ephemeral runner
        run: npm run harness -- setup --bmad-tools codex,claude-code,cline
      - name: Check sources and adapters
        run: |
          set +e
          node .harness/scripts/check-skill-sources.mjs --report .harness/evidence/skill-source-report.md
          check_status=$?
          cat .harness/evidence/skill-source-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$check_status" -eq 1 ]; then
            echo "Local installation or adapter integrity failed." >&2
            exit 1
          fi
          if [ "$check_status" -eq 2 ]; then
            echo "A source update is available. Prepare it on a dedicated branch with npm run harness -- update --apply."
            exit 0
          fi
          exit "$check_status"
