name: Skill source maintenance

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate Harness script tests
        run: node --test .harness/scripts/*.test.mjs .harness/hooks/*.test.mjs
      - name: Install the committed managed sources in the ephemeral runner
        run: npm run harness -- setup --agents claude-code,codex,cline
      - name: Check sources and adapters
        run: |
          set +e
          node .harness/scripts/check-skill-sources.mjs --report .harness/evidence/skill-source-report.md
          check_status=$?
          cat .harness/evidence/skill-source-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$check_status" -eq 1 ]; then
            echo "Local installation or adapter integrity failed." >&2
            exit 1
          fi
          if [ "$check_status" -eq 2 ]; then
            echo "A source update is available. Prepare it on a dedicated branch with npm run harness -- update-skills --apply."
            exit 0
          fi
          exit "$check_status"
